        - PluginRunActionByName
      description: |
        Most actions are self explanatory and have no parameters. To see all actions, expand the enum at the bottom.

        Actions ending in a number are shortcuts for the same action without the number, with that number as its parameter. `MusicPlayer_Hotcue1` is `MusicPlayer_Hotcue` with `index` 0, and `Application_SetRating3` is `Application_SetRating` with `amount` 3.

        The following actions have parameters:

        - `MusicPlayer_Load` - Loads a track into the player. Parameter `id`, the track ID. Without it nothing happens
        - `MusicPlayer_Seek` - Seek the current playing track to a progress (0 to 1) or seconds. Parameter `progress` or `seconds` as number
        - `MusicPlayer_Hotcue` - Creates or jumps to a hot cue. Parameter `index` as integer, starting at 0
        - `MusicPlayer_CreateHotcue`, `MusicPlayer_DeleteHotcue`, `MusicPlayer_MoveHotcue`, `MusicPlayer_ToggleMemoryCue` - Parameter `index` as integer, starting at 0
        - `MusicPlayer_ApplyCueTemplate`, `MusicPlayer_AddAndApplyCueTemplate` - Apply cue template. Parameter `index` as integer, starting at 0
        - `MusicPlayer_JumpBeats` - Jumps x beats. Parameter `beats` as positive or negative integer
        - `MusicPlayer_JumpSeconds` - Jumps x seconds. Parameter `seconds` as positive or negative number
        - `MusicPlayer_LoopCreate` - Turns the current cue into a loop. Parameter `beats`, the loop length in beats
        - `Application_SetRating` - Set rating of the selected tracks. Parameter `amount` from 0 to 5
        - `Application_SetEnergy`, `Application_SetDanceability`, `Application_SetPopularity`, `Application_SetHappiness` - Set that field of the selected tracks. Parameter `amount` from 0 to 10
        - `Application_SetColor` - Set color of the selected tracks. Parameter `color`, see the Color enum for values, or `null` to remove the color
        - `Application_Tags_AddShortcut` - Adds the Custom Tags assigned to tag shortcut `amount` to the selected tracks. Parameter `amount` as integer from 1 to 20
        - `Application_Tags_ToggleShortcut` - Toggles the Custom Tags assigned to tag shortcut `amount` on the selected tracks. Parameter `amount` as integer from 1 to 20
        - `TrackBrowser_FocusFilter` - Focus track browser filter. Parameter `field`, see the Track Fields enum for values
        - `FavoritePlaylists_ShowPlaylist` - Shows the favorited playlist. Parameter `amount`, the favorite slot starting at 1
        - `FavoritePlaylists_AddSelectedTracks` - Adds the selected tracks to the favorited playlist. Parameter `amount`, the favorite slot starting at 1
        - `AudioAnalyzer_Analyze` - Analyzes tracks in the background, like the Analyze dialog does. Parameters:
          - `trackIds` - array of track IDs, required. An empty array does nothing
          - `analyzeKey`, `analyzeBeatgrid`, `analyzeWaveform`, `analyzeEnergy`, `doNotOverwrite` - booleans. One you leave out uses the setting from the Analyze dialog, and none of them are stored
          - `tempoRange` - string `"<min>_<max>"`, such as `"88_175"`. Unlike the booleans this is stored as the Lexicon analysis setting, so it applies to later analysis too. The Analyze dialog offers `0_300` (any), `58_115`, `68_135`, `78_155`, `88_175`, `98_195`, `128_255` and `180_300`
          `TrackBrowser_Analyze` opens the Analyze dialog instead
        - `Direct2Cdj_LoadDeck` - Loads the one track selected in the track browser onto a player. Parameter `deckNumber`, the player number. Needs a connected Direct2CDJ player
        - `Direct2Cdj_LoadEmptyDeck` - Loads the track in the Lexicon player onto the first Direct2CDJ player that is not playing
        - `PluginRunActionByName` - Runs a plugin action. Parameters `pluginName` and `pluginActionName`
        - `PluginRunAction_<pluginId>:<actionId>` - Runs a plugin action by ID. Both IDs are part of the action itself, for example `PluginRunAction_myplugin:myaction`, so it is not in the enum

        These actions have no parameters:

        - `MusicPlayer_TempomarkerSet` - Move marker to the current position
        - `MusicPlayer_TempomarkerFind` - Jump to next marker
        - `MusicPlayer_TempomarkerAdd` - Add marker at current position
        - `MusicPlayer_TempomarkerRemove` - Delete current marker
        - `MusicPlayer_TempomarkerDoubleBpm` - Double current marker BPM
        - `MusicPlayer_TempomarkerHalveBpm` - Halve current marker BPM

        `MusicPlayer_TempomarkerMoveGridLeft`, `MusicPlayer_TempomarkerMoveGridRight`, `MusicPlayer_TempomarkerIncreaseBpm` and `MusicPlayer_TempomarkerDecreaseBpm` only work as a hotkey. The API accepts them and does nothing.

    Error:
      type: object
      properties:
        message:
          type: string
          description: What went wrong
          example: "'limit' must be less than or equal to 1000, value: 5000"
        errorCode:
          type: integer
          example: 5
          description: |
            Most errors come with HTTP status 400. Codes `6` and `9` come with 401 and code `8` with 500.

            - `1` - The body is not valid JSON
            - `2` - Too many requests that change the library are waiting their turn. Older versions of Lexicon also return it for any request sent while another is still running
            - `4` - The endpoint does not exist, or not with this HTTP method
            - `5` - Invalid input, the message says which parameter and why
            - `6` - The app in `app` is not allowed to use the API, see the Lexicon settings
            - `8` - Something went wrong inside Lexicon while handling the request. Please report it with the message
            - `9` - The API token is missing or wrong, see Authentication at the top of this page. Starting in Lexicon v1.12
            - `100` - Track does not exist
            - `101` - Playlist does not exist
            - `102` - Parent playlist is not a folder
            - `103` - Parent playlist does not exist
            - `104` - The playlist has the wrong type for this request, such as adding tracks to a folder
            - `105` - Custom Tag category does not exist
            - `106` - Another Custom Tag has this label
            - `107` - Another Custom Tag category has this label
            - `108` - Another Custom Tag in the category has this position
            - `109` - Custom Tag does not exist
            - `110` - Another track already has this location
            - `111` - The file does not exist on disk
            - `112` - The root playlist cannot be changed or deleted
            - `113` - No track is selected in Lexicon, for an `id` of `selected`

    Track Sort:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          description: Field to sort on
          enum:
            - id
            - title
            - artist
            - albumTitle
            - label
            - remixer
            - mix
            - composer
            - producer
            - grouping
            - lyricist
            - comment
            - key
            - genre
            - bpm
            - rating
            - color
            - year
            - duration
            - bitrate
            - playCount
            - location
            - lastPlayed
            - dateAdded
            - dateModified
            - sizeBytes
            - sampleRate
            - trackNumber
            - energy
            - danceability
            - popularity
            - happiness
            - extra1
            - extra2
            - type
            - importSource
            - locationUnique
            - incoming
            - archived
            - archivedSince
            - beatshiftCase
            - fingerprint
            - streamingService
            - streamingId
          example: title
        dir:
          type: string
          enum:
            - asc
            - desc
          default: asc

  responses:
    Error:
      description: >
        Bad request. The body holds `message` and `errorCode`, see the Error schema for all codes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    trackSource:
      in: query
      name: source
      schema:
        allOf:
          - $ref: "#/components/schemas/Track Sources"
        default: non-archived
    trackFields:
      in: query
      name: fields
      example: ["artist", "title", "bpm"]
      description: >
        Array of fields to include in the Track object. Defaults to all fields. More fields will take longer to query, try to limit queried fields to those you need. In a query string, repeat the parameter: `fields=artist&fields=title`.
      schema:
        type: array
        default: []
        items:
          $ref: "#/components/schemas/Track Fields"
    trackSort:
      in: query
      name: sort
      description: >
        Array of sort objects. With 0 sort objects, it will not do any sorting and use the database order. With 1 sort object, it will perform a normal sort. With 2 sorting objects, it will sort by the first object first and then sort by the second object. This works the same as holding the CTRL button when sorting in Lexicon. `dir` defaults to `asc`.


        In a JSON body, send it as an array. In a query string, send the array as JSON, `sort=[{"field":"title","dir":"asc"}]`, or in bracket form, `sort[0][field]=title&sort[0][dir]=asc`.
      content:
        application/json:
          schema:
            type: array
            maxItems: 2
            items:
              $ref: "#/components/schemas/Track Sort"
          example: [{ "field": "title", "dir": "desc" }]
