# Source: https://www.lexicondj.com/developer/api-docs.yaml
---
openapi: 3.0.0
servers:
- url: http://localhost:48624/v1
info:
  version: 1.0.0
  title: Lexicon Local API
  termsOfService: https://www.lexicondj.com/terms
security:
  - {}
  - bearerAuth: []
tags:
- name: Track
- name: Playlist
- name: Custom Tag
- name: Control
- name: Music Player
paths:
  "/track":
    get:
      tags:
        - Track
      summary: Get one track from the Lexicon library
      description: >
        Send `selected` as `id` to get the track selected in Lexicon. With several tracks selected this is the topmost one, use `GET /tracks/selected` to get them all. When no track is selected the request fails with error code `113`.
      parameters:
        - in: query
          name: id
          description: ID of the track, or `selected` for the track selected in Lexicon
          required: true
          schema:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                enum: [selected]

      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      track:
                        $ref: "#/components/schemas/Track"

        '400':
          $ref: '#/components/responses/Error'

    patch:
      tags:
      - Track
      summary: Updates one track in the Lexicon library
      description: >
        Track object of changes to make.


        You can use most fields available in the Track schema.


        Some fields are not editable, most of these fields belong to a file, such as location, bitrate, etc.


        Number fields (eg `playCount` or `energy`) can accept a number and string value. A string value must always start with `+` or `-` and will change the value relative to the current value. Any other value, such as an object or a boolean, is rejected with a 400; it is never coerced to `0`.


        A field name that is not a track field is rejected with a 400, so a typo cannot look like a successful edit.


        Date fields must be in the YYYY-MM-DD format.


        Cue points and beatgrid marker (called tempo markers internally) can be saved as an array. Tags can be saved as a number array of tag IDs. See the Cuepoint and Tempomarker fields for all available properties.


        The response holds the track as it is stored after the edit, so you see the result of a relative edit without another request.


        Send `selected` as `id` to edit the tracks selected in Lexicon instead, such as giving whatever the user has selected 5 stars. Every selected track gets the edits, and a relative edit counts from each track's own value. The response then also holds `tracks`, all edited tracks in the order Lexicon shows them, with `track` being the first of them. When no track is selected the request fails with error code `113` and nothing changes.


        Click the dropdown below to see examples for the full body of a request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  oneOf:
                    - type: integer
                    - type: string
                      enum: [selected]
                  description: ID of the track, or `selected` for the tracks selected in Lexicon
                edits:
                  type: object
                  description: Track object of changes to make
            examples:
              basic:
                summary: Basic example making multiple changes
                value:
                  id: 1
                  edits:
                    title: "My New Title"
                    energy: 10
              selected:
                summary: Rate the selected tracks 5 stars
                value:
                  id: selected
                  edits:
                    rating: 5
              cuepoints:
                summary: Saving cue points
                value:
                  id: 1
                  edits:
                    cuepoints:
                      - position: 0
                        startTime: 0.5
                        type: "1"
              tempomarkers:
                summary: Saving tempo markers
                value:
                  id: 1
                  edits:
                    tempomarkers:
                      - bpm: 174
                        startTime: 0.5
              tags:
                summary: Saving tags
                value:
                  id: 1
                  edits:
                    tags: [1, 2, 3]
      responses:
        '200':
          description: Successful operation. Returns the updated track.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      track:
                        $ref: "#/components/schemas/Track"
                      tracks:
                        type: array
                        description: Only when `id` is `selected`. Every edited track, in the order Lexicon shows them
                        items:
                          $ref: "#/components/schemas/Track"
        '400':
          $ref: '#/components/responses/Error'

  "/track/location":
    patch:
      tags:
      - Track
      summary: Changes the location of one track in the Lexicon library
      description: >
        Points a track at a different file. This only changes the library, the file itself is never moved or renamed.


        The path is normalized before it is saved, so the `location` in the response can differ slightly from the one you sent. Always use the location from the response.


        A location can exist only once in Lexicon. When another track already uses the target location the request fails with error code `110` and nothing is changed.


        By default the target file has to exist on disk, otherwise the request fails with error code `111`. Send `checkFileExists: false` to relocate to a file that is not there, for example when the drive is not mounted.


        Streaming tracks cannot be relocated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - location
              properties:
                id:
                  type: integer
                  description: ID of the track
                location:
                  type: string
                  description: Full path to the new file
                  example: "/Users/Daft/Music/Daft Punk - Around The World.mp3"
                checkFileExists:
                  type: boolean
                  description: Check whether the file exists on disk before saving the new location
                  default: true
            examples:
              basic:
                summary: Relocate a track to another file
                value:
                  id: 1
                  location: "/Users/Daft/Music/Daft Punk - Around The World.mp3"
              skipFileCheck:
                summary: Relocate without checking the disk
                value:
                  id: 1
                  location: "/Volumes/USB/Daft Punk - Around The World.mp3"
                  checkFileExists: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      track:
                        $ref: "#/components/schemas/Track"

        '400':
          description: >
            Bad request


            `100` - Track does not exist


            `110` - Another track already has this location


            `111` - The file does not exist on disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/tracks":
    post:
      tags:
        - Track
      summary: Add new tracks to the Lexicon library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - locations
              properties:
                locations:
                  type: array
                  items:
                    type: string
                  description: String array of file locations
                  example: ["D:/Music/Daft Punk - Get Lucky.mp3"]

      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tracks:
                        $ref: "#/components/schemas/Track"

        '400':
          $ref: '#/components/responses/Error'

    get:
      tags:
        - Track
      summary: Get all tracks from the Lexicon library
      description: Specify limit, offset and the track fields to retrieve. Fewer fields will be more performant
      parameters:
        - in: query
          name: limit
          description: Amount of tracks. Max 1000. Default is 1000, the example uses 10 to keep the response small.
          example: 10
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 1000
        - in: query
          name: offset
          description: Offset from start of tracks
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/trackSource'
        - $ref: '#/components/parameters/trackFields'
        - $ref: '#/components/parameters/trackSort'

      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: 
                        type: integer
                        example: 1200
                      limit:
                        type: integer
                        example: 1000
                      offset:
                        type: integer
                        example: 0
                      tracks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Track"

        '400':
          $ref: '#/components/responses/Error'

    delete:
      tags:
      - Track
      summary: Deletes one track or more in the Lexicon library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: Array of track IDs to delete
                  example: [1, 2, 3]
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/Error'

  "/tracks/selected":
    get:
      tags:
        - Track
      summary: Get the IDs of the tracks selected in Lexicon
      description: >
        The tracks selected in the track browser the user last worked in, in the order Lexicon shows them. `ids` is always an array: empty when nothing is selected or no track browser is open, one ID for a single selected track.


        To act on the selection directly, send `selected` as the `id` of `GET /track` or `PATCH /track`.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ids:
                        type: array
                        items:
                          type: integer
                        example: [12, 7, 33]

  "/search/tracks":
    get:
      tags:
        - Track
      summary: Searches the Lexicon library for tracks
      description: >
        The `filter` value is an object with the fields to filter on. These are the same filters as the columns of the Lexicon track browser, and a track has to match all of them. A field that cannot be filtered is rejected with a 400, so a typo cannot quietly return the whole library.


        Filterable fields: `id`, `title`, `artist`, `albumTitle`, `label`, `remixer`, `mix`, `composer`, `producer`, `grouping`, `lyricist`, `comment`, `key`, `genre`, `bpm`, `rating`, `color`, `year`, `duration`, `bitrate`, `playCount`, `location`, `lastPlayed`, `dateAdded`, `dateModified`, `sizeBytes`, `sampleRate`, `trackNumber`, `energy`, `danceability`, `popularity`, `happiness`, `extra1`, `extra2`, `tags` and `fileType`. Archived and incoming tracks are chosen with `source`, not with a filter.


        **Text** matches anywhere inside the value and ignores case. `color` is text too, so `red` also finds `red_dark`. `none` finds tracks where the field is empty. That works on the text fields except `location`, and on `bpm`, `bitrate`, `sampleRate`, `lastPlayed` and `tags`.


        **Numbers** are sent as strings and take an operator: `>=120`, `>120`, `<=120`, `<120`, `!120` (not 120), `120-130` (120 up to and including 130) and `120~130` (at least 120, below 130). A plain number must match exactly, except for `bpm` where `128` also finds 128.5. `sizeBytes` is filtered in MB.


        **Dates** are `YYYY-MM-DD` (or the date format set in Lexicon). `2024-05-01` finds that day, `>2024-05-01` that day and later, `<2024-05-01` everything before it.


        **`key`** accepts any notation Lexicon shows, such as `8A` or `Am`.


        **`tags`** takes Custom Tag labels, separated by commas. A track matches when it has any of them. Start with `~` to require all of them (`~Vocals,Warmup`), and put `!` before a label to exclude it (`!Vocals`). A label that does not exist matches nothing. `none` finds tracks without any tag, unless one of your tags is labeled None.


        **`fileType`** is the file extension, such as `mp3` or `flac`, ignoring case.


        **`id`** looks tracks up by id. A single id or a comma separated list is accepted, so playlist membership can be resolved to track metadata in one request, for example `{"id": "12,48,153"}`. An id that does not exist returns no results.


        **`location`** is converted to a unique location before finding results. A unique location is a string that is: string normalized, unicode normalized, lowercased and for macOS has the main drive name prefixed. So a location like `/Users/chris/Music/foo.mp3` is changed to `/Volumes/Macintosh HD/chris/Music/foo.mp3`. This is the basis of unique tracks in Lexicon.


        Returns an array of tracks that match the given filter. Use `limit` and `offset` to page through them; `total` always reports the full number of matches, not the size of the page.
      parameters:
        - $ref: '#/components/parameters/trackSource'
        - in: query
          name: limit
          description: Amount of tracks. Max 1000. Default is 1000.
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 1000
        - in: query
          name: offset
          description: Offset from the start of the matching tracks
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: filter
          style: deepObject
          explode: true
          description: >
            The object with the fields to filter on, see the description above. In a query string, send each field in bracket form, `filter[artist]=Daft%20Punk&filter[bpm]=%3E%3D120`.
          schema:
            type: object
          example: >
            {
              "artist": "Daft Punk",
              "bpm": ">=120"
            }
        - $ref: '#/components/parameters/trackFields'
        - $ref: '#/components/parameters/trackSort'

      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: 
                        type: integer
                        example: 1200
                      limit:
                        type: integer
                        example: 1000
                      offset:
                        type: integer
                        example: 0
                      tracks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Track"

        '400':
          $ref: '#/components/responses/Error'

  "/playlist":
    get: 
      tags:
        - Playlist
      summary: Gets one playlist from the Lexicon library by the playlist ID
      description: >
        Includes the track IDs of the playlist in their original order.


        For a folder, `trackIds` holds the tracks of every playlist inside it, each track once. A smartlist is refreshed before its tracks are listed.
      parameters:
        - in: query
          name: id
          description: ID of the playlist
          required: true
          schema: 
            type: integer
            minimum: 1

      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      playlist:
                        $ref: "#/components/schemas/Playlist"

        '400':
          $ref: '#/components/responses/Error'

    post:
      tags:
        - Playlist
      summary: Create a new playlist
      description: Create a new playlist or playlist folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  description: Playlist name
                  example: "Drum & Bass"
                parentId:
                  type: integer
                  description: Parent playlist folder ID. Leave empty to add to the bottom of the playlist tree.
                  example: 123
                type:
                  $ref: '#/components/schemas/Playlist Type'
                smartlist:
                  $ref: '#/components/schemas/Smartlist'
                  description: Smartlist object containing rules. Only applicable to playlist with type=3. See Smartlist Operators enum for available rule operators.

      responses:
        '200':
          description: Successful operation. Returns ID of the new playlist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID of the new playlist

        '400':
          $ref: '#/components/responses/Error'

    patch:
      tags:
        - Playlist
      summary: Updates a playlist
      description: >
        Update playlist properties.


        The root folder is the invisible container that the whole playlist tree hangs off. It cannot be renamed or moved, and a request that targets it is rejected with error code `112`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: Playlist ID
                  example: 123
                name:
                  type: string
                  description: Playlist name
                  example: My Playlist
                parentId:
                  type: integer
                  description: ID of the folder to move the playlist into. It is added at the bottom of that folder unless `position` is also given.
                  example: 123
                position:
                  type: integer
                  description: Index inside the parent folder, starting at 0. The other playlists in that folder shift to make room, like dragging in the playlist tree. Together with `parentId`, this is the index in the new folder.
                  example: 0
                smartlist:
                  $ref: '#/components/schemas/Smartlist'
                  description: Smartlist object containing rules. Only applicable to playlist with type=3. See Smartlist Operators enum for available rule operators.

      responses:
        '200':
          description: Successful operation. Returns the ID of the playlist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID of the playlist

        '400':
          $ref: '#/components/responses/Error'

  "/playlist-by-path":
    get:
      tags:
        - Playlist
      summary: Gets one playlist from the Lexicon library by the playlist path
      description: >
        Includes the track IDs of the playlist in their original order. For a folder, the tracks of every playlist inside it, each track once.


        You don't need to know the playlist ID for this endpoint, only the path. This is very useful if you re-import your library since all IDs will be reset.


        `type` defaults to `2`, so only normal playlists are found unless you pass it. To find a folder or a smartlist, send its type. When several playlists of that type share the path, the first one is returned.
      parameters:
        - in: query
          name: path
          description: Full path of the playlist as string array
          required: true
          example: ["Music", "Techno", "Hits"]
          schema: 
            type: array
            items:
              type: string
        - in: query
          name: type
          description: Type of the playlist to find. Defaults to `2`, a normal playlist, so a folder (`1`) or smartlist (`3`) is only found when you send its type.
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/Playlist Type"
            default: '2'

      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      playlist:
                        $ref: "#/components/schemas/Playlist"

        '400':
          $ref: '#/components/responses/Error'

  "/playlist-tracks":
    patch:
      tags:
        - Playlist
      summary: Add tracks to a playlist
      description: Add tracks to a playlist at specific index or at the end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - trackIds
              properties:
                id:
                  type: integer
                  description: Playlist ID
                  example: 123
                trackIds:
                  type: array
                  items:
                    type: integer
                  description: Array of track IDs
                  example: [4, 5, 6]
                index:
                  type: integer
                  description: Index where to place the tracks in the playlist. Leave empty to add to the end of the playlist.
                  example: 0

      responses:
        '200':
          description: Successful operation

        '400':
          $ref: '#/components/responses/Error'

    delete:
      tags:
        - Playlist
      summary: Remove tracks from a playlist
      description: Remove tracks from a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - trackIds
              properties:
                id:
                  type: integer
                  description: Playlist ID
                  example: 123
                trackIds:
                  type: array
                  items:
                    type: integer
                  description: Array of track IDs
                  example: [4, 5, 6]

      responses:
        '200':
          description: Successful operation

        '400':
          $ref: '#/components/responses/Error'

  "/playlists":
    get: 
      tags:
        - Playlist
      summary: Gets all playlists as a recursive tree
      description: Does not include track IDs. To see what tracks a playlist has, use the `GET /playlist` endpoint
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      playlists:
                        type: array
                        items:
                          $ref: "#/components/schemas/Playlist"

    delete:
      tags:
        - Playlist
      summary: Deletes one or more playlists
      description: >
        Deletes one or more playlists by playlist ID.


        The root folder cannot be deleted. If it appears anywhere in `ids` the whole request is rejected with error code `112` and nothing is deleted.


        Send `ids` in a JSON body. Only GET requests read the query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: Array of playlist IDs to delete
                  example: [123, 124, 125]

      responses:
        '200':
          description: Successful operation

        '400':
          $ref: '#/components/responses/Error'

  "/playlists/selected":
    get:
      tags:
        - Playlist
      summary: Get the IDs of the playlists selected in Lexicon
      description: >
        The playlists, smartlists and folders selected in the playlist tree. A selected folder is listed by its own ID, not by the playlists inside it, and the root folder is never listed. `ids` is always an array, empty when nothing is selected.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ids:
                        type: array
                        items:
                          type: integer
                        example: [123, 124]

  "/tag":
    post:
      tags:
        - Custom Tag
      summary: Create a new Custom Tag
      description: Create a new Custom Tag and add it to a Custom Tag category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - label
              properties:
                categoryId:
                  type: integer
                  description: Category ID to place the new Custom Tag into
                  example: 2
                label:
                  type: string
                  description: The label of the new Custom Tag
                  example: "Vocals"

      responses:
        '200':
          description: Successful operation. Returns the new Custom Tag object at the top level of the response, not inside `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Custom Tag"

        '400':
          $ref: '#/components/responses/Error'

    patch:
      tags:
        - Custom Tag
      summary: Updates an existing Custom Tag
      description: >
        Updates properties of an existing Custom Tag.


        A `position` that another tag in the category already has is rejected with error code `108`. To reorder several tags at once, send the whole order to `PATCH /tag-category` as `tags`.


        When `categoryId` moves the tag to another category, it goes to the end of that category unless you also send a free `position`. The tags it leaves behind are renumbered so their positions stay contiguous.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: ID of the Custom Tag to update
                  example: 1
                categoryId:
                  type: integer
                  description: New Custom Tag category to place this Custom Tag into
                  example: 2
                label:
                  type: string
                  description: The label of the Custom Tag
                  example: "Vocals"
                position:
                  type: integer
                  description: The position (index) of the Custom Tag in its Custom Tag category
                  example: 0

      responses:
        '200':
          description: Successful operation. Returns the updated Custom Tag object at the top level of the response, not inside `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Custom Tag"

        '400':
          $ref: '#/components/responses/Error'

    delete:
      tags:
        - Custom Tag
      summary: Delete a Custom Tag by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: Custom Tag ID
                  example: 1
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/Error'

  "/tags":
    get:
      tags:
        - Custom Tag
      summary: Get all Custom Tags and Custom Tag categories
      description: >
        Both arrays come back in the order Lexicon displays them: categories by their own `position`, and the tags inside each category by `position`.


        `position` is what orders tags inside a category, so use it rather than the tag id if you want to show tags the way the user arranged them. Tag ids are handed out in creation order, so sorting by id puts the newest tag last.


        Reorder a tag by sending a new `position` to `PATCH /tag`. A position that is already taken in that category is rejected with error code `108`, so move the occupant out of the way first.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Custom Tag Category"
                      tags:
                        type: array
                        items:
                          $ref: "#/components/schemas/Custom Tag"

  "/tag-category":
    post:
      tags:
        - Custom Tag
      summary: Create a new Custom Tag category
      description: Create a new Custom Tag category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  description: The label of the new Custom Tag category
                  example: "Genre"
                color:
                  type: string
                  description: The color of the new Custom Tag category
                  example: '#FF00FF'

      responses:
        '200':
          description: Successful operation. Returns the new Custom Tag category object at the top level of the response, not inside `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Custom Tag Category"

        '400':
          $ref: '#/components/responses/Error'

    patch:
      tags:
        - Custom Tag
      summary: Updates an existing Custom Tag category
      description: >
        Updates properties of an existing Custom Tag category.


        A label that another category already has, ignoring case, is rejected with error code `107`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: ID of the Custom Tag category to update
                  example: 1
                label:
                  type: string
                  description: The label of the Custom Tag category
                  example: "Vocals"
                color:
                  type: string
                  description: The color of the Custom Tag category
                  example: '#FF00FF'
                tags:
                  type: array
                  items:
                    type: integer
                  description: >
                    Every tag of this category as Custom Tag IDs, in the order you want them. Tags from other categories are moved into this one, and the categories they leave are renumbered.
                    Each tag the category already has must be in the list, otherwise the request is rejected with error code `5`, because a tag cannot be without a category. Move a tag out with `PATCH /tag` or delete it instead.
                    An unknown tag ID is rejected with error code `109`.
                  example: [1, 2]
                position:
                  type: integer
                  description: Index of the category among all categories, starting at 0. The other categories shift to make room.
                  example: 0

      responses:
        '200':
          description: Successful operation. Returns the updated Custom Tag category object at the top level of the response, not inside `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Custom Tag Category"

        '400':
          $ref: '#/components/responses/Error'

    delete:
      tags:
        - Custom Tag
      summary: Delete a Custom Tag category by ID and all Custom Tags in it.
      description: ⚠️ Warning. This will delete all Custom Tags in this category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: Custom Tag category ID
                  example: 1
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/Error'

  "/control":
    post:
      tags:
        - Control
      summary: Run Lexicon commands
      description: >
        With the control endpoint, you can run commands in Lexicon: the same ones you can bind to a hotkey.


        The [Stream Deck](https://discuss.lexicondj.com/t/controlling-lexicon-from-your-stream-deck/54) plugin also uses this endpoint. If you want to create custom controls from outside Lexicon, this is what you should use.


        Many actions work on the tracks selected in the track browser or on the track loaded in the player, exactly like their hotkey. See the Control Actions schema at the bottom for every action and its parameters.


        The response is empty. An action starts something in Lexicon and the response does not wait for it to finish, and there is no completion signal. An action that needs something that is not there, such as a loaded track or a selection, does nothing and still returns 200. An unknown action is rejected with error code `5`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  $ref: '#/components/schemas/Control Actions'
                parameters:
                  type: object
                  description: Depends on the action. See Control Action schema for available parameters
            examples:
              setEnergy:
                summary: Set energy
                value:
                  action: Application_SetEnergy
                  parameters:
                    amount: 3
              hotcue:
                summary: Jump to hotcue
                value:
                  action: MusicPlayer_Hotcue
                  parameters:
                    index: 0
              load:
                summary: Load a track into the player
                value:
                  action: MusicPlayer_Load
                  parameters:
                    id: 1
              analyze:
                summary: Analyze tracks
                value:
                  action: AudioAnalyzer_Analyze
                  parameters:
                    trackIds: [1, 2, 3]
                    analyzeBeatgrid: true
                    tempoRange: "88_175"

      responses:
        '200':
          description: Successful operation

        '400':
          $ref: '#/components/responses/Error'

  "/playing":
    get:
      tags:
        - Music Player
      summary: Get the currently playing track
      description: >
        Returns the currently playing track and the position of the player. When there is no track, `track`, `progress` and `currentTime` are all `null`.

      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      track:
                        $ref: "#/components/schemas/Track"
                      progress:
                        type: number
                        description: Position in the track from 0 to 1
                        example: 0.25
                      currentTime:
                        type: number
                        description: Position in the track in seconds
                        example: 91.5

  "/queue":
    get:
      tags:
        - Music Player
      summary: Get the queued tracks
      description: >
        Returns the current queue (without currently playing track).
        When you start playing a single track, the queue is filled up with "hidden" tracks. These are the next tracks in your playlist/library to allow Lexicon to keep playing even when you don't create a queue.
          
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tracks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Track"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Starting in Lexicon v1.12: the API token from the Lexicon settings under Integrations. Only needed when Require Authentication is on."
  schemas:
    Track:
      type: object
      required:
        - type
        - location
        - locationUnique
      properties:
        id:
          type: integer
          description: Unique ID
          example: 1
        type:
          type: string
          description: >
            `0` - Local track


            `1` - Streaming track
          enum:
            - '0'
            - '1'
        title:
          type: string
          example: Get Lucky
        artist:
          type: string
          example: Daft Punk
        albumTitle:
          type: string
          example: Random Access Memories
        label:
          type: string
          example: Columbia Records
        remixer:
          type: string
          example: 
        mix:
          type: string
          example: 
        composer:
          type: string
          example: 
        producer:
          type: string
          example: 
        grouping:
          type: string
          example: 
        lyricist:
          type: string
          example: 
        comment:
          type: string
          example: 
        key:
          type: string
          example: 4M
        genre:
          type: string
          example: Electronic
        bpm:
          type: number
          format: float
          example: 128
        rating:
          type: integer
          minimum: 0
          maximum: 5
          example: 5
        color:
          $ref: '#/components/schemas/Color'
          example: Green
        year:
          type: integer
          example: 2013
        duration:
          type: number
          format: float
          description: In seconds
          example: 367
        bitrate:
          type: integer
          description: In kbps
          example: 320
        playCount:
          type: integer
          minimum: 0
          example: 5
        location:
          type: string
          description: Full path to track
          example: C:/Users/chris/Music/Random Access Memories/Get Lucky.mp3
        locationUnique:
          type: string
          description: Unique full path to track, Unicode normalized and lowercased
          example: c:/users/chris/music/random access memories/get lucky.mp3
        lastPlayed:
          type: string
          description: ISO date
          example: '2022-09-05T19:30:45.048Z'
        dateAdded: 
          type: string
          description: ISO date
          example: '2022-09-05T19:30:45.048Z'
        dateModified:
          type: string
          description: ISO date
          example: '2022-09-05T19:30:45.048Z'
        sizeBytes:
          type: integer
          example: 15023993
        sampleRate:
          type: integer
          example: 44100
        trackNumber: 
          type: integer
          description: The track number on the release/CD, has no other function
          example: 8
        energy:
          type: integer
          minimum: 0
          maximum: 10
          example: 7
        danceability:
          type: integer
          minimum: 0
          maximum: 10
          example: 10
        popularity:
          type: integer
          minimum: 0
          maximum: 10
          example: 10
        happiness:
          type: integer
          minimum: 0
          maximum: 10
          example: 9
        extra1:
          type: string
          example: null
        extra2:
          type: string
          example: null
        streamingService:
          type: string
          description: >
            `0` - Beatport LINK

            
            `1` - Beatsource LINK
            
            
            `2` - SoundCloud
            
            
            `3` - Tidal
          enum: 
            - null
            - '0'
            - '1'
            - '2'
            - '3'
          example: null
        streamingId:
          type: string
          description: ID of the track on the streaming service
          example: null
        tags:
          type: array
          items:
            type: number
          example: [1, 2]
          description: Custom Tag IDs, ordered the way Lexicon displays them; by Custom Tag category, then by the tag's position within it. The order you send to PATCH /track is not preserved, because a track's tags have no order of their own.
        tempomarkers:
          type: array
          items:
            $ref: '#/components/schemas/Tempomarker'
        cuepoints:
          type: array
          items:
            $ref: '#/components/schemas/Cuepoint'
        fingerprint:
          type: string
          description: Audio fingerprint, added after running the duplicate scanner
          example: null
        beatshiftCase:
          type: string
          enum:
            - 'A'
            - 'B'
            - 'C'
            - 'D'
          description: Beatshift scanner result
          example: null
        archived:
          type: number
          enum:
            - 0
            - 1
          example: 0
        archivedSince:
          type: string
          description: ISO date
          example: null
        incoming:
          type: number
          enum:
            - 0
            - 1
          example: 0
        importSource:
          type: string
          enum: 
            - '-2'
            - '-1'
            - '1'
            - '3'
            - '4'
            - '5'
            - '6'
            - '7'
            - '8'
          description: >
            `-2` - Rekordbox 5

            
            `-1` - Rekordbox 6 / 7
            
            
            `1` - Local
            
            
            `3` - Traktor Pro
            
            
            `4` - VirtualDJ
            
            
            `5` - Serato
            
            
            `6` - EngineDJ
            
            
            `7` - iTunes
            
            
            `8` - M3U playlist
          example: '1'
        data:
          type: object
          description: Additional data based on the DJ app it was imported from
          example: '{}'

    Playlist:
      type: object
      required:
        - name
        - type
        - parentId
        - position
        - trackIds
      properties:
        id:
          type: integer
          description: Unique ID
          example: 1
        name:
          type: string
          example: Drum & Bass
        dateAdded:
          type: string
          example: '2022-09-05T19:30:45.048Z'
        type:
          example: '2'
          $ref: '#/components/schemas/Playlist Type'
        folderType:
          type: string
          enum:
            - null
            - '1'
            - '2'
          description: >
            `1` -  Root folder. Always at the very top of the playlist tree. Can only exist once.


            `2` - Lexicon folder. Special folder that Lexicon uses as default folder to save playlists in.
          example: null
        parentId:
          type: integer
          example: 2
        position:
          type: integer
          description: Index position in the parent playlist folder
          example: 0
        trackIds:
          type: array
          items:
            type: number
          description: Array of track IDs in original (unsorted) order
        smartlist:
          $ref: '#/components/schemas/Smartlist'

    Cuepoint:
      type: object
      required:
        - type
        - startTime
        - position
      properties:
        id:
          type: integer
          description: Unique ID
          example: 1
        name:
          type: string
          example: Cue 1
        type:
          type: string
          enum:
            - '1'
            - '2'
            - '3'
            - '4'
            - '5'
          description: >
            `1` - Normal cue


            `2` - Fade-in marker for DJ apps that support it


            `3` - Fade-out marker for DJ apps that support it


            `4` - Load marker for DJ apps that support it


            `5` - Loop cue
          example: '1'
        startTime:
          type: number
          format: float
          description: Start time of cue or loop in seconds
          example: 40.2
        endTime:
          type: number
          format: float
          description: End time of loop in seconds. Required for loops
          example: null
        position:
          type: integer
          description: Index of cue, must be unique per track
          example: 0
        color:
          $ref: '#/components/schemas/Color'
          example: red
        activeLoop:
          type: boolean
          description: For a loop cue, whether the loop is active when the track is loaded, in DJ apps that support it
          example: false
        trackId:
          type: integer
          description: ID of the track. Set by Lexicon, a value you send is replaced
          example: 1
        data:
          type: object
          description: Extra data from the DJ app the cue point was imported from. Send it back unchanged to keep it
          example: {}

    Tempomarker:
      type: object
      description: Tempomarker or beatgrid marker
      required:
        - startTime
        - bpm
      properties:
        id:
          type: integer
          description: Unique ID
          example: 1
        startTime:
          type: number
          format: float
          description: Start time of the tempomarker in seconds
          example: 0.15
        bpm:
          type: number
          description: BPM of the marker from that point onwards
          example: 174
        trackId:
          type: integer
          description: ID of the track. Set by Lexicon, a value you send is replaced
          example: 1
        data:
          type: object
          description: Extra data from the DJ app the marker was imported from. Send it back unchanged to keep it
          example: {}

    Custom Tag:
      type: object
      required:
        - label
        - categoryId
        - position
      properties:
        id:
          type: integer
          description: Unique ID
          example: 1
        label:
          type: string
          example: Vocals
        categoryId:
          type: number
          example: 2
        position:
          type: number
          example: 0
          description: Index of the Custom Tags in the Custom Tags category
        shortcut:
          type: integer
          nullable: true
          example: null
          description: Tag shortcut number (1 to 20) this tag is assigned to, used by `Application_Tags_AddShortcut` and `Application_Tags_ToggleShortcut`. `null` when it has none

    Custom Tag Category:
      type: object
      required:
        - label
        - position
      properties:
        id:
          type: integer
          description: Unique ID
          example: 2
        label:
          type: string
          example: Vocals
        position:
          type: number
          example: 0
          description: Index of the category
        color:
          type: string
          example: '#FF00FF'
          description: Color of the Custom Tags category. Left out when the category has no color
        tags:
          type: array
          items:
            type: integer
          example: [1]

    Color:
      type: string
      description: Enum
      enum:
        - red_dark
        - red
        - red_light
        - red_orange
        - orange
        - beige
        - yellow_dark
        - yellow
        - lime
